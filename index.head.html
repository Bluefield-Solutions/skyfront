  <title>Skyfront</title>
  <style>
    /* position:fixed auf dem Rumpf, nicht nur overflow:hidden. Auf iOS nimmt
       Safari einen senkrechten Wisch sonst als Seiten-Scrollen und blendet
       dabei seine eigene Leiste ein — im Spiel sieht das aus wie ein heller
       Balken, der beim Hoch-und-Runter-Ziehen der Maschine auftaucht.
       overscroll-behavior verhindert zusaetzlich das Nachfedern am Rand. */
    html,body{margin:0;height:100%;background:#05080d;overflow:hidden;
      position:fixed;inset:0;width:100%;
      overscroll-behavior:none;touch-action:none;
      -webkit-user-select:none;user-select:none;
      -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    #game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      touch-action:none}
    canvas{touch-action:none}
    #diag{position:fixed;inset:0;z-index:9999;padding:18px;box-sizing:border-box;
      color:#9fe3ff;font:14px/1.5 monospace;white-space:pre-wrap;pointer-events:none}
    /* Gebrandeter Startscreen (Skyfront) – deckt den Ladevorgang bis Boot fertig ist */
    #splash{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:2px;
      background:radial-gradient(60% 45% at 50% 42%, #123f68 0%, #0a1f36 55%, #050c17 100%);
      transition:opacity .45s ease;pointer-events:none}
    #splash.hide{opacity:0}
    #splash img{width:132px;height:132px;filter:drop-shadow(0 8px 22px #0009);animation:sffloat 3s ease-in-out infinite}
    #splash .wm{margin-top:14px;font:700 40px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      letter-spacing:4px;color:#eaf6ff;text-shadow:0 3px 10px #0008}
    #splash .sub{margin-top:8px;font:700 13px/1 -apple-system,Roboto,sans-serif;
      letter-spacing:6px;color:#ffcf6a}
    #splash .load{margin-top:26px;font:12px/1 monospace;letter-spacing:2px;color:#7fb3d8;animation:sfpulse 1.3s ease-in-out infinite}
    #splash .balken{margin-top:14px;width:190px;height:4px;border-radius:2px;
      background:rgba(120,180,220,.16);overflow:hidden}
    #splash .balken i{display:block;height:100%;width:0;border-radius:2px;
      background:linear-gradient(90deg,#4fb6e8,#ffcf6a);transition:width .28s ease}
    @keyframes sffloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes sfpulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

<!-- Der Ladeschirm steht ABSICHTLICH vor den Skripten. Lag er wie frueher am
     Dateiende, erschien er erst, wenn die ganzen 24 MB geparst waren —
     gemessen 5,3 s bei sechsfach gedrosselter CPU, davor nur dunkler Schirm.
     Hier kann der Browser ihn zeichnen, bevor er den Bildvorrat verarbeitet. -->
</head>
<body>

  <script>
    // Klassisches Inline-Script (läuft auch dort, wo Module blockiert sind) → macht Fehler sichtbar.
    (function () {
      var d = document.getElementById('diag');
      function show(msg, bad) { if (!d) return; d.style.color = bad ? '#ff8a8a' : '#9fe3ff'; d.textContent += '\n' + msg; }
      window.__diag = show;
      window.addEventListener('error', function (e) {
        show('FEHLER: ' + (e.message || e.error || e) + (e.filename ? (' @ ' + String(e.filename).slice(0,40) + ':' + e.lineno) : ''), true);
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('PROMISE-FEHLER: ' + ((e.reason && e.reason.message) || e.reason), true);
      });
      // Absichtlich NUR in die Konsole: der Streifen liegt mit z-index 9999
      // ueber dem Ladeschirm, und der steht auf dem Telefon sekundenlang im
      // Bild. Fehler bleiben sichtbar — die will man sehen.
      try { console.log('Script läuft (UA: ' + navigator.userAgent.slice(0, 60) + ')'); } catch (e) {}

      // Der Balken liest den Prozentsatz aus dem Text, den das Spiel ohnehin
      // schreibt ("lädt … 52%"). So bleibt app.js unangetastet: die Huelle
      // stellt dar, das Spiel meldet. Wer den Text im Spiel aendert, muss
      // hier nichts nachziehen — der Balken bleibt dann eben stehen, statt
      // etwas Falsches zu zeigen.
      try {
        var zeile = document.querySelector('#splash .load');
        var fuell = document.querySelector('#splash .balken i');
        if (zeile && fuell && window.MutationObserver) {
          new MutationObserver(function () {
            var m = /(\d+)\s*%/.exec(zeile.textContent || '');
            if (m) fuell.style.width = Math.min(100, +m[1]) + '%';
          }).observe(zeile, { childList: true, characterData: true, subtree: true });
        }
      } catch (e) {}
    })();
  </script>
