  <title>Skyfront</title>
  <style>
    /* position:fixed auf dem Rumpf, nicht nur overflow:hidden. Auf iOS nimmt
       Safari einen senkrechten Wisch sonst als Seiten-Scrollen und blendet
       dabei seine eigene Leiste ein — im Spiel sieht das aus wie ein heller
       Balken, der beim Hoch-und-Runter-Ziehen der Maschine auftaucht.
       overscroll-behavior verhindert zusaetzlich das Nachfedern am Rand. */
    html,body{margin:0;height:100%;background:#05080d;overflow:hidden;
      position:fixed;inset:0;width:100%;
      overscroll-behavior:none;touch-action:none;
      -webkit-user-select:none;user-select:none;
      -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    #game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      touch-action:none}
    canvas{touch-action:none}
    #diag{position:fixed;inset:0;z-index:9999;padding:18px;box-sizing:border-box;
      color:#9fe3ff;font:14px/1.5 monospace;white-space:pre-wrap;pointer-events:none}
    /* Versionszeile. Sie steht IMMER da — Menue wie Gefecht —, ganz klein und
       unten mittig, damit man auf dem Telefon jederzeit sieht, welcher Stand
       gerade laeuft. Bewusst im DOM und nicht auf der Leinwand: so kann sie
       keine der Bildmessungen stoeren, die alle die Leinwand ausmessen.
       pointer-events:none, damit sie keinen Tipp abfaengt. Der z-index liegt
       unter Splash (9000) und Diagnose (9999), aber ueber dem Spiel. */
    #version{position:fixed;left:0;right:0;bottom:2px;z-index:8000;
      text-align:center;pointer-events:none;user-select:none;
      color:rgba(190,215,240,.38);font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.75)}
    @supports(padding:max(0px)){#version{bottom:max(2px,env(safe-area-inset-bottom))}}
    /* Gebrandeter Startscreen (Skyfront) – deckt den Ladevorgang bis Boot fertig ist */
    #splash{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:2px;
      background:radial-gradient(60% 45% at 50% 42%, #123f68 0%, #0a1f36 55%, #050c17 100%);
      transition:opacity .45s ease;pointer-events:none}
    #splash.hide{opacity:0}
    #splash img{width:132px;height:132px;filter:drop-shadow(0 8px 22px #0009);animation:sffloat 3s ease-in-out infinite}
    #splash .wm{margin-top:14px;font:700 40px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      letter-spacing:4px;color:#eaf6ff;text-shadow:0 3px 10px #0008}
    #splash .sub{margin-top:8px;font:700 13px/1 -apple-system,Roboto,sans-serif;
      letter-spacing:6px;color:#ffcf6a}
    #splash .load{margin-top:26px;font:12px/1 monospace;letter-spacing:2px;color:#7fb3d8;animation:sfpulse 1.3s ease-in-out infinite}
    #splash .balken{margin-top:14px;width:190px;height:4px;border-radius:2px;
      background:rgba(120,180,220,.16);overflow:hidden}
    #splash .balken i{display:block;height:100%;width:0;border-radius:2px;
      background:linear-gradient(90deg,#4fb6e8,#ffcf6a);transition:width .28s ease}
    /* ---- Messtafel (SKY-008) --------------------------------------------
       Alle Leistungszahlen dieses Projekts stammten bisher aus SwiftShader,
       also aus einer Software-Rasterung ohne Grafikkarte. Was das Telefon
       wirklich leistet, wusste niemand. Diese Tafel misst auf dem Geraet.
       Sie haengt bewusst in der HUELLE, nicht im Spiel: sie ueberlebt auch
       einen Absturz des Spiels und misst die echte Bildfolge, nicht Phasers
       geglaetteten Wert.
       Aufrufen: Adresse mit #messung, oder VIER Mal in die obere rechte Ecke
       tippen (fuer die App auf dem Startbildschirm, wo es keine Adresszeile
       gibt). Nochmal vier Mal tippen schliesst sie.
       Der Knopf "Kopieren" legt alle Werte als EINE Zeile in die
       Zwischenablage — eine Messung, die auf dem Telefon bleibt, ist keine
       Messung. */
    /* Die Tafel schwebt UEBER der Knopfreihe, nicht darauf. Zuerst sass sie
       am unteren Rand — und lag damit genau auf EMP, Sturm und Bombe. Wer
       damit misst, kann waehrend der Messung nicht mehr voll spielen, und
       die dichten Momente sind die interessanten. 104 px sind die Hoehe der
       Knopfreihe auf 844 px, gemessen am gebauten Spiel. */
    #messung{position:fixed;left:0;right:0;z-index:9500;display:none;
      bottom:calc(104px + env(safe-area-inset-bottom));
      padding:10px 12px;
      background:rgba(6,12,20,.93);border-top:1px solid #2a4c6a;
      border-bottom:1px solid #2a4c6a;
      color:#cfe6f5;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
      -webkit-overflow-scrolling:touch}
    #messwerte{margin:0;white-space:pre;overflow-x:auto;font:inherit;color:inherit}
    #messknoepfe{display:flex;flex-wrap:wrap;align-items:center}
    #messung.an{display:block}
    #messung b{color:#ffd23a;font-weight:600}
    #messung .warn{color:#ff8a6a}
    #messung .gut{color:#8fe0b0}
    #messung .knopf{display:inline-block;margin-top:8px;margin-right:8px;
      padding:6px 14px;border:1px solid #2a4c6a;border-radius:7px;color:#9fe3ff;
      background:rgba(20,40,60,.7);pointer-events:auto;cursor:pointer}
    #messung .knopf.haupt{color:#0a1a24;background:#9fe3ff;border-color:#9fe3ff;font-weight:600}
    #messung .zeile{display:block;margin-top:8px;width:100%;box-sizing:border-box;
      padding:6px 8px;border:1px solid #2a4c6a;border-radius:7px;
      background:rgba(10,20,30,.9);color:#cfe6f5;font:11px/1.4 ui-monospace,monospace}
    @keyframes sffloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes sfpulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

     gemessen 5,3 s bei sechsfach gedrosselter CPU, davor nur dunkler Schirm.
     Hier kann der Browser ihn zeichnen, bevor er den Bildvorrat verarbeitet. -->

    // Klassisches Inline-Script (läuft auch dort, wo Module blockiert sind) → macht Fehler sichtbar.
    (function () {
      var d = document.getElementById('diag');
      function show(msg, bad) { if (!d) return; d.style.color = bad ? '#ff8a8a' : '#9fe3ff'; d.textContent += '\n' + msg; }
      window.__diag = show;
      window.addEventListener('error', function (e) {
        show('FEHLER: ' + (e.message || e.error || e) + (e.filename ? (' @ ' + String(e.filename).slice(0,40) + ':' + e.lineno) : ''), true);
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('PROMISE-FEHLER: ' + ((e.reason && e.reason.message) || e.reason), true);
      });
      // Absichtlich NUR in die Konsole: der Streifen liegt mit z-index 9999
      // ueber dem Ladeschirm, und der steht auf dem Telefon sekundenlang im
      // Bild. Fehler bleiben sichtbar — die will man sehen.

      // Der Balken liest den Prozentsatz aus dem Text, den das Spiel ohnehin
      // schreibt ("lädt … 52%"). So bleibt app.js unangetastet: die Huelle
      // stellt dar, das Spiel meldet. Wer den Text im Spiel aendert, muss
      // hier nichts nachziehen — der Balken bleibt dann eben stehen, statt
      // etwas Falsches zu zeigen.
      try {
        var zeile = document.querySelector('#splash .load');
        var fuell = document.querySelector('#splash .balken i');
        if (zeile && fuell && window.MutationObserver) {
          new MutationObserver(function () {
            var m = /(\d+)\s*%/.exec(zeile.textContent || '');
            if (m) fuell.style.width = Math.min(100, +m[1]) + '%';
          }).observe(zeile, { childList: true, characterData: true, subtree: true });
        }
      } catch (e) {}
    })();

      // haelt requestAnimationFrame an, sobald die Seite nicht sichtbar ist,
      // und beim Zurueckkommen ist der erste Abstand die ganze Abwesenheit.
      // Wer die Zeile kopiert und dazu die App verlaesst, erzeugt den
      // Ausschlag selbst.
      //
      // Weggelassen wird der Abstand aber NICHT: er wird als Pause gezaehlt
      // und angezeigt. Eine Zahl, die still verschwindet, ist schlimmer als
      // eine, die falsch aussieht.
      var versteckt = false, pausen = 0, pausenMs = 0;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) versteckt = true;
      });
      // Wo wurde gemessen? Die Zahlen aus dem Menue sagen ueber das Gefecht
      // nichts — dort laeuft nichts ausser der Kulisse. Beim ersten Bild im
      // Gefecht faengt die Messung deshalb von vorn an, genau einmal.
      var warImSpiel = false;

      function anzeigen(zustand) {
        an = zustand;
        tafel.className = an ? 'an' : '';
        if (an) { zuruecksetzen(); zeichnen(); }
      }
      function zuruecksetzen() {
        proben.length = 0; letzte5.length = 0;
        laengste = 0; laengsteBei = 0; bilder = 0;
        pausen = 0; pausenMs = 0; versteckt = false;
        start = performance.now(); vorher = 0;
      }
      // Kein eigenes Element als Fangflaeche: auf einem 16:9-Geraet laege sie
      // genau ueber Pause- und Tonknopf und wuerde deren Tipps schlucken.
      // Stattdessen nur MITHOEREN, nie abfangen — vier schnelle Tipps in die
      // obere rechte Ecke. Vier statt drei, damit ein hektisches Pausieren die
      // Tafel nicht versehentlich aufzieht.
      // Der Knopf im Gefecht ruft hier herein. Er ist der Weg, den man SIEHT;
      // die vier Tipps bleiben als zweiter Weg, falls die Spielszene gar
      // nicht hochkommt.
      window.__SKF_MESSTAFEL = function () { anzeigen(!an); };

      window.addEventListener('pointerdown', function (e) {
        // Gemessen an der LEINWAND, nicht am Fenster. Hochkant ist die
        // Leinwand oben und unten schwarz umrandet: bei 390x844 liegt ihre
        // Oberkante bei y = 76, die Knopfreihe des Spiels bei y = 96 — die
        // alte Flaeche endete bei 56 und lag damit vollstaendig im schwarzen
        // Rand. Wer in die sichtbare obere rechte Ecke tippte, traf nie.
        var lw = document.querySelector('canvas');
        var k = lw ? lw.getBoundingClientRect() : { left: 0, top: 0, right: innerWidth, bottom: innerHeight };
        var ecke = Math.max(56, Math.min(k.right - k.left, k.bottom - k.top) * 0.18);
        if (e.clientX < k.right - ecke || e.clientY < k.top || e.clientY > k.top + ecke) { tipps = 0; return; }
        var jetzt = Date.now();
        // Zwei Sekunden je Tipp, nicht 1,2: auf einem stotternden Geraet
        // kommen vier Tipps nicht schneller an. Gemessen in der langsamen
        // Pruefumgebung: 1,4 s Abstand, obwohl 0,15 s angefordert waren.
        tipps = (jetzt - letzterTipp < 2000) ? tipps + 1 : 1;
        letzterTipp = jetzt;
        if (tipps >= 4) { tipps = 0; anzeigen(!an); }
      }, true);
      // Die letzte gezeichnete Zeile, damit "Kopieren" genau das mitnimmt,
      // was auf dem Schirm steht.
      var letzteZeile = '';
      tafel.addEventListener('pointerdown', function (e) {
        var k = e.target && e.target.getAttribute && e.target.getAttribute('data-tat');
        if (!k) return;
        e.preventDefault();
        if (k === 'reset') { zuruecksetzen(); return; }
        if (k === 'kopieren') kopieren();
      }, { passive: false });

      // Eine Messung, die auf dem Telefon bleibt, ist keine Messung. Der
      // Knopf legt alles als EINE Zeile in die Zwischenablage; wenn die
      // Zwischenablage nicht mitspielt (aeltere Browser, kein sicherer
      // Kontext), erscheint stattdessen ein Feld, das man markieren kann.
      function kopieren() {
        var txt = letzteZeile;
        function ersatz() {
          var alt = knoepfe.querySelector('.zeile');
          if (alt) alt.parentNode.removeChild(alt);
          var f = document.createElement('input');
          f.className = 'zeile'; f.value = txt; f.readOnly = true;
          knoepfe.appendChild(f);
          f.focus(); f.setSelectionRange(0, txt.length);
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(function () {
              var k = knoepfe.querySelector('[data-tat="kopieren"]');
              if (k) { k.textContent = 'Kopiert ✓'; setTimeout(function () { k.textContent = 'Kopieren'; }, 1600); }
            }, ersatz);
          } else ersatz();
        } catch (e) { ersatz(); }
      }
      if ((location.hash || '').indexOf('messung') >= 0) anzeigen(true);

      function p(feld, anteil) {
        if (!feld.length) return 0;
        var k = feld.slice().sort(function (a, b) { return a - b; });
        return k[Math.min(k.length - 1, Math.floor(k.length * anteil))];
      }
      function zahl(x, n) { return (Math.round(x * Math.pow(10, n || 1)) / Math.pow(10, n || 1)).toFixed(n || 1); }

      function schleife(t) {
        requestAnimationFrame(schleife);
        if (!an) { vorher = t; return; }
        // Beim ersten Bild im Gefecht von vorn anfangen: Menuewerte sagen
        // ueber das Gefecht nichts.
        var s0 = window.__game && window.__game.scene && window.__game.scene.getScene
                 ? window.__game.scene.getScene('Game') : null;
        var drin = !!(s0 && s0.scene && s0.scene.isActive && s0.scene.isActive());
        if (drin && !warImSpiel) { warImSpiel = true; zuruecksetzen(); vorher = t; return; }
        if (!drin) warImSpiel = false;

        if (vorher) {
          var d = t - vorher;
          if (versteckt) {
            // Die App war weg. Als Pause buchen, nicht als Bildluecke.
            versteckt = false; pausen++; pausenMs += d;
          } else {
            bilder++;
            if (proben.push(d) > 400) proben.shift();
            letzte5.push([t, d]);
            while (letzte5.length && t - letzte5[0][0] > 5000) letzte5.shift();
            if (d > laengste) { laengste = d; laengsteBei = Math.round((t - start) / 100) / 10; }
          }
        }
        vorher = t;
        if (bilder % 12 === 0) zeichnen();
      }
      requestAnimationFrame(schleife);

      function zeichnen() {
        var med = p(proben, 0.5), p95 = p(proben, 0.95);
        var l5 = 0; for (var i = 0; i < letzte5.length; i++) if (letzte5[i][1] > l5) l5 = letzte5[i][1];
        var hz = med > 0 ? 1000 / med : 0;
        // NULLEN SIND KEINE MESSUNG.
        //
        // Die Tafel setzt beim Aufziehen zurueck. Wer sie oeffnet und sofort
        // auf "Kopieren" tippt, nimmt eine Zeile mit, in der "1000,0/s" und
        // "p50 0,0 ms" steht — das sieht aus wie eine Messung und ist keine.
        // Genau so eine Zeile waere vom Geraet zurueckgekommen und haette
        // eine Fahrt gekostet.
        //
        // 60 Proben sind bei 30 Bildern zwei Sekunden. Darunter sagt die
        // Tafel, dass sie noch nichts hat, und der Knopf gibt nichts heraus.
        var GENUG = 60;
        var reif = proben.length >= GENUG && med > 0;
        var takt = hz > 100 ? 120 : hz > 75 ? 90 : hz > 45 ? 60 : Math.round(hz);
        var lauf = (performance.now() - start) / 1000;
        var g = window.__game, s = null;
        try { s = g && g.scene && g.scene.getScene && g.scene.getScene('Game'); } catch (e) {}
        var imSpiel = s && s.scene && s.scene.isActive && s.scene.isActive();

        function kl(wert, warn) { return wert > warn ? 'warn' : 'gut'; }
        // Die Version steht in der Huelle (#version) und damit auch dann zur
        // Verfuegung, wenn das Spiel gar nicht erst hochkommt.
        var vEl = document.getElementById('version');
        var ver = (vEl && vEl.textContent || '').trim() || '?';
        var z = [];
        z.push('<b>MESSTAFEL</b>  <b>' + ver + '</b>   ' + zahl(lauf, 0) + ' s   ' + bilder + ' Bilder');
        if (!reif) z.push('<span class="warn">noch zu wenig gemessen — ' + proben.length + ' von ' + GENUG + ' Bildern.</span>');
        z.push('Bildrate      <b>' + (reif ? zahl(1000 / med, 0) : '—') + '</b>/s   Anzeige ~' + (reif ? takt : '—') + ' Hz');
        z.push('Bildzeit      p50 ' + zahl(med) + ' ms   p95 <span class="' + kl(p95, 1000 / takt * 1.6) + '">' + zahl(p95) + '</span> ms');
        z.push('Laengste      <span class="' + kl(laengste, 50) + '">' + zahl(laengste) + '</span> ms bei ' + laengsteBei + ' s   ·   5 s: <span class="' + kl(l5, 50) + '">' + zahl(l5) + '</span> ms');
        // Pausen stehen DANEBEN, nicht in der laengsten Bildluecke. Sie sind
        // kein Ruckler — aber sie verschwinden auch nicht.
        if (pausen) z.push('Pausen        ' + pausen + 'x App im Hintergrund, zusammen ' + zahl(pausenMs / 1000) + ' s (nicht als Ruckler gezaehlt)');
        if (g && g.loop) {
          z.push('Phaser        geglaettet ' + zahl(g.loop.delta) + ' ms   roh ' + zahl(g.loop.rawDelta || 0) + ' ms');
        }
        if (imSpiel) {
          try {
            var ak = function (gr) { return gr.countActive(true) + '/' + gr.getLength(); };
            z.push('Objekte       Bild ' + s.children.list.length + '   Gegner ' + ak(s.enemies) + '   Kugeln ' + ak(s.bullets) + ' / ' + ak(s.enemyBullets));
            z.push('Budget        Q ' + s.qBudget.toFixed(2) + '   fx ' + s.fxActive + '/' + s.fxPool.length + '   Tests ' + s.hitTests);
          } catch (e) {}
        }
        if (g && g.textures) {
          var mb = 0, n = 0;
          try {
            for (var k in g.textures.list) { var q = g.textures.list[k].source[0]; if (q) { mb += q.width * q.height * 4; n++; } }
          } catch (e) {}
          z.push('Texturen      ' + n + ' Stueck   ' + zahl(mb / 1048576, 0) + ' MB');
        }
        var c = g && g.canvas;
        z.push('Geraet        ' + Math.round(innerWidth) + '×' + Math.round(innerHeight) + ' @ ' + (window.devicePixelRatio || 1) + 'x' +
               (c ? '   Puffer ' + c.width + '×' + c.height : ''));
        // Dieselben Werte noch einmal als eine Zeile, zum Mitnehmen.
        // Die Version gehoert in die MITGENOMMENE Zeile, nicht nur auf den
        // Schirm: eine Messung, die nicht sagt, aus welchem Stand sie stammt,
        // ist spaeter nicht mehr zuzuordnen — und genau dafuer ist sie da.
        if (!reif) {
          // Die Restzeit aus der BISHER gemessenen Rate, nicht aus einer
          // angenommenen: auf einem langsamen Geraet dauert es laenger, und
          // eine zu optimistische Ansage schickt den Nutzer zu frueh zum
          // Knopf. Ohne jede Probe bleibt die Annahme 30/s.
          var rate = med > 0 ? 1000 / med : 30;
          letzteZeile = 'SKYFRONT-MESSUNG ' + ver + ' | NOCH NICHTS GEMESSEN — bitte im Gefecht '
            + Math.max(1, Math.ceil((GENUG - proben.length) / rate)) + ' s laufen lassen und dann kopieren.';
          werte.innerHTML = z.join('\n');
          return;
        }
        var eine = ['SKYFRONT-MESSUNG ' + ver];
        eine.push(Math.round(innerWidth) + 'x' + Math.round(innerHeight) + '@' + (window.devicePixelRatio || 1) + 'x');
        if (c) eine.push('Puffer ' + c.width + 'x' + c.height);
        eine.push(zahl(1000 / (med || 1), 0) + '/s (~' + takt + 'Hz)');
        eine.push('p50 ' + zahl(med) + ' p95 ' + zahl(p95) + ' ms');
        eine.push('laengste ' + zahl(laengste) + ' ms bei ' + laengsteBei + ' s');
        if (pausen) eine.push('Pausen ' + pausen + 'x/' + zahl(pausenMs / 1000) + ' s');
        eine.push('5s ' + zahl(l5) + ' ms');
        if (g && g.loop) eine.push('Phaser ' + zahl(g.loop.delta) + '/' + zahl(g.loop.rawDelta || 0));
        if (imSpiel) {
          try {
            eine.push('Objekte ' + s.children.list.length);
            eine.push('Gegner ' + s.enemies.countActive(true) + ' Kugeln ' + s.bullets.countActive(true) + '/' + s.enemyBullets.countActive(true));
            eine.push('Q ' + s.qBudget.toFixed(2));
            eine.push('PWR ' + (s.player ? s.player.powerLevel : '?') + ' Sektor ' + s.stage);
          } catch (e) {}
        } else eine.push('(im Menue gemessen — bitte IM GEFECHT messen)');
        eine.push(zahl(lauf, 0) + ' s / ' + bilder + ' Bilder');
        eine.push(navigator.userAgent.replace(/[|]/g, '/'));
        letzteZeile = eine.join(' | ');

        werte.innerHTML = z.join('\n');
      }
    })();
  </script>
