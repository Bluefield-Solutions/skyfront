# Veroeffentlicht Skyfront als installierbare Web-App auf GitHub Pages.
#
# Gebaut wird dist/pages/ — der Master als Einzeldatei, dazu Manifest, Symbol
# und Dienst-Arbeiter. Erst diese drei machen aus der HTML etwas, das iOS auf
# den Startbildschirm legen kann.
#
# Voraussetzung, einmalig von Hand: Settings → Pages → Source auf
# "GitHub Actions" stellen. Ohne das schlaegt configure-pages fehl.
name: Pages

# AUSGELIEFERT WIRD NUR, WAS DIE TORKETTE BESTANDEN HAT.
#
# Bis v53 hing dieser Lauf am Push und startete damit GLEICHZEITIG mit
# "Skyfront Check". Gemessen an Lauf 93 und 94: Pages war nach vier Minuten
# fertig, der strenge Check nach neun. Fuenf Minuten lang lag also eine
# Fassung auf der Seite, von der noch niemand wusste, ob sie durch die Tore
# geht — und waere der Check danach rot geworden, waere sie liegen
# geblieben. Ein Tor, das nach der Lieferung anschlaegt, ist kein Tor.
#
# `workflow_run` kehrt die Reihenfolge um: dieser Lauf startet, wenn der
# Check FERTIG ist, und baut nur weiter, wenn er gruen war. Der Preis sind
# rund neun Minuten mehr bis zur Seite. Das ist der Preis dafuer, dass auf
# der Seite nichts Ungeprueftes liegt.
on:
  workflow_run:
    workflows: ["Skyfront Check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Zwei Lieferungen gleichzeitig wuerden sich gegenseitig ueberholen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    # Von Hand angestossen: immer. Vom Check angestossen: nur wenn er gruen
    # war. Ohne diese Zeile liefe die Lieferung auch nach einem roten Check
    # — `types: [completed]` heisst "fertig", nicht "bestanden".
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          # GENAU den Stand holen, den der Check geprueft hat. Ohne `ref`
          # nimmt checkout bei `workflow_run` den Kopf des Standardzweigs —
          # und das kann ein spaeterer, ungepruefter Commit sein.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright, gepinnt wie im Check. Ja, das kostet eine Minute — und
      # es ist die Minute, die v49 bis v51 gefehlt hat. Was ausgeliefert
      # wird, wird vorher einmal gestartet, ueber http und mit
      # Dienst-Arbeiter. Unter file:// gibt es den naemlich nicht, und genau
      # daran haengt die Musik.
      - name: Playwright installieren (für den Hochlauf der Web-App)
        run: |
          npm install playwright@1.56.0
          npx playwright install --with-deps chromium

      # EIN Aufruf, und er baut selbst. Vorher stand hier ein Shell-Block mit
      # zwanzig Vergleichen — dieselben Regeln wie in der Torkette, nur an
      # einer Stelle, die beim Arbeiten niemand laeuft. Zwei Kopien derselben
      # Regel driften auseinander, und die ungelaufene ist immer die richtige.
      # Jetzt steht sie in tools/auslieferung.mjs, und `npm run check` laeuft
      # sie mit: ein gruener Lauf schliesst eine rote Lieferung wieder aus.
      - name: Web-App bauen und nachweisen, dass sie lieferbar ist
        run: node tools/auslieferung.mjs

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  liefern:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.lieferung.outputs.page_url }}
    steps:
      - name: Auf Pages veroeffentlichen
        id: lieferung
        uses: actions/deploy-pages@v4
