# Skyfront — CI-Check bei jedem Push / Pull Request.
# Voraussetzung: Die Projektdateien (check.mjs, build.mjs, src/, profiles/ …)
# liegen im Repo-Wurzelverzeichnis. Liegen sie in einem Unterordner, setze unten
# bei den run-Steps eine passende working-directory.
name: Skyfront Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright ist GEPINNT. Ungepinnt ist die Messumgebung eine Variable,
      # die niemand beobachtet: die Bildtor-Ausfaelle am 23.08. traten zwar
      # bei gleicher Chromium-Fassung auf, aber das war Glueck — mit
      # "npm install playwright" haette derselbe Commit am naechsten Tag
      # gegen einen anderen Browser gemessen, ohne dass es irgendwo steht.
      # Eine Zahl traegt ihre Messstelle mit, und dazu gehoert der Browser.
      #
      # Die Fassung ist dieselbe, gegen die hier entwickelt wird (1.56.0).
      # Wer sie hebt, hebt sie bewusst und sieht sich die Tore danach an.
      - name: Playwright installieren (für den Boot-Test)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.56.0
          npx playwright install --with-deps chromium
          node -e "console.log('  Playwright', require('playwright/package.json').version)"
          npx playwright --version

      - name: Check ausführen (Build + Boot-Test)
        run: node check.mjs

      - name: Prüfbericht in die Job-Zusammenfassung schreiben
        if: always()
        run: |
          if [ -f dist/check-report.md ]; then
            cat dist/check-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kein check-report.md gefunden." >> "$GITHUB_STEP_SUMMARY"
          fi
