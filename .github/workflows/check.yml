# Skyfront — CI-Check bei jedem Push / Pull Request.
# Voraussetzung: Die Projektdateien (check.mjs, build.mjs, src/, profiles/ …)
# liegen im Repo-Wurzelverzeichnis. Liegen sie in einem Unterordner, setze unten
# bei den run-Steps eine passende working-directory.
name: Skyfront Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright ist GEPINNT. Ungepinnt ist die Messumgebung eine Variable,
      # die niemand beobachtet: die Bildtor-Ausfaelle am 23.08. traten zwar
      # bei gleicher Chromium-Fassung auf, aber das war Glueck — mit
      # "npm install playwright" haette derselbe Commit am naechsten Tag
      # gegen einen anderen Browser gemessen, ohne dass es irgendwo steht.
      # Eine Zahl traegt ihre Messstelle mit, und dazu gehoert der Browser.
      #
      # Die Fassung ist dieselbe, gegen die hier entwickelt wird (1.56.0).
      # Wer sie hebt, hebt sie bewusst und sieht sich die Tore danach an.
      - name: Playwright installieren (für den Boot-Test)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.56.0
          npx playwright install --with-deps chromium
          node -e "console.log('  Playwright', require('playwright/package.json').version)"
          npx playwright --version

      # --streng: hier zaehlt "nicht gemessen" als Fehlschlag. Beim Arbeiten
      # tut es das nicht (ein staendig rotes Tor wird ignoriert), vor der
      # Auslieferung schon — dort ist "nicht nachgesehen" so wenig wert wie
      # "nicht bestanden". Das Bildtor laeuft NUR hier: es kostet 174 s von
      # 302 s der Kette, und ein unbeaufsichtigter Lauf ist genau der Ort
      # dafuer.
      - name: Check ausführen (Build + Boot-Test, alle Tore, streng)
        run: node check.mjs --streng

      - name: Prüfbericht in die Job-Zusammenfassung schreiben
        if: always()
        run: |
          if [ -f dist/check-report.md ]; then
            cat dist/check-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kein check-report.md gefunden." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Die Gegenproben laufen NEBEN dem Check, nicht dahinter: sie kosten
  # gemessen 230 s, der Check 325 s — parallel also keine Wartezeit.
  #
  # Warum ueberhaupt in der CI: eine Pruefung, die nie etwas meldet, ist kein
  # Beweis. Zwei Pruefungen dieses Projekts haben vier Versionen lang gruen
  # gemeldet und dabei gar nichts geprueft. Gefunden hat das keine Torkette,
  # sondern eine Gegenprobe. Die acht Modusproben stellen sicher, dass jedes
  # Tor seine drei Ausgaenge (0 · 1 · 2) noch wirklich nehmen kann.
  #
  # Die 25 Fehlerinjektionen bleiben aussen vor — sie brauchen Neubauten und
  # 15 bis 30 Minuten. Wer ein Tor anfasst, laesst sie mit `npm run proben`
  # laufen; `npm run wache` sagt an, wann das faellig ist.
  proben:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installieren
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Bauen
        run: node build.mjs

      - name: Modusproben (jedes Tor muss seine drei Ausgänge nehmen können)
        run: node tools/farbproben.mjs --nurmodus
